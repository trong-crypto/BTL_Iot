<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | IoT Command Center</title>
    <link rel="stylesheet" href="./css/global.css?v=fit-2">
    <link rel="stylesheet" href="./css/login.css?v=fit-2">
</head>
<body>

    <main class="login-page">
        <section class="login-card">
            <h1>IoT Command Center</h1>
            <p>Đăng nhập để tiếp tục</p>

            <form id="loginForm" action="/api/auth/login" method="post">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <p id="loginError" role="alert" hidden></p>
                <button class="btn btn-primary" type="submit">Đăng nhập</button>
            </form>
        </section>
    </main>
    <script src="./js/auth.js?v=jwt-1"></script>
    <script src="./js/login.js?v=jwt-1"></script>
    
</body>
</html>
