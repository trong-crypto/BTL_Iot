server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: Back_end_Iot
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iot_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

iot:
  jwt:
    secret: ${IOT_JWT_SECRET:}
    issuer: ${IOT_JWT_ISSUER:iot-command-center}
    ttl-seconds: ${IOT_JWT_TTL_SECONDS:3600}
  mqtt:
    host: ${IOT_MQTT_HOST:localhost}
    port: ${IOT_MQTT_PORT:1001}
    username: ${IOT_MQTT_USERNAME:}
    password: ${IOT_MQTT_PASSWORD:}
    client-id: ${IOT_MQTT_CLIENT_ID:iot-backend}
